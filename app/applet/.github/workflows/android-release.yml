name: Build Production (Release) APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Release Keystore
      run: |
        keytool -genkey -v -keystore my-upload-key.jks -storepass release123 -alias upload -keypass release123 -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Production App"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Release APK
      env:
        KEYSTORE_PATH: my-upload-key.jks
        STORE_PASSWORD: release123
        KEY_PASSWORD: release123
      run: gradle assembleRelease --no-daemon --stacktrace
      
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: AxBet-Cricket-Production-APK
        path: app/build/outputs/apk/release/app-release.apk
